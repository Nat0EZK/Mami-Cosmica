# Compila la app de React y publica app/dist/ en GitHub Pages.
#
# Hace falta porque el repositorio ya no tiene un index.html en la raíz:
# el sitio vive en app/ y el navegador no puede ejecutar .tsx sin compilar.
#
# En Settings → Pages, "Source" debe estar en "GitHub Actions".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empuja varias veces seguidas, deja terminar el despliegue en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      # "prebuild" copia img/ y videos/ de la raíz a app/public/.
      - name: Compilar
        working-directory: app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
